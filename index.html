<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoreo de visitas a sede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --board:#2A322E;
  --board-2:#242B28;
  --wood:#6B4A2B;
  --chalk:#F0EDE4;
  --chalk-2:rgba(240,237,228,.66);
  --chalk-3:rgba(240,237,228,.34);
  --rule:rgba(240,237,228,.26);
  --amarillo:#F3D17A;
  --verde:#9FD6A8;
  --rojo:#E8958C;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--chalk); font-family:"Patrick Hand",system-ui,sans-serif;
  font-size:17px; line-height:1.4;
  background-color:var(--board);
  background-image:
    radial-gradient(ellipse 70% 55% at 22% 18%, rgba(255,255,255,.055), transparent 70%),
    radial-gradient(ellipse 60% 50% at 82% 72%, rgba(255,255,255,.04), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(97deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(8deg, rgba(0,0,0,.05) 0 3px, transparent 3px 9px);
  background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--board-2);z-index:40}
h1,h2,.mano{font-family:"Caveat",cursive}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:linear-gradient(180deg,var(--board-2),rgba(36,43,40,.94));
  border-bottom:3px double var(--rule); backdrop-filter:blur(3px)}
.hd{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
h1{font-size:31px;font-weight:700;margin:0;letter-spacing:.01em;text-shadow:0 1px 0 rgba(255,255,255,.18)}
.reloj{margin-left:auto;font-family:"Caveat";font-size:25px;font-weight:600;color:var(--chalk-2)}
.dias{display:flex;gap:5px;flex-wrap:wrap;width:100%}
.dia{appearance:none;background:none;border:2px solid var(--chalk-3);color:var(--chalk-2);
  font:600 17px/1 "Caveat";padding:7px 15px;border-radius:14px 11px 15px 10px;cursor:pointer}
.dia[aria-pressed="true"]{background:var(--chalk);color:var(--board);border-color:var(--chalk)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px dashed var(--amarillo);outline-offset:3px}
.tools{display:flex;gap:7px;width:100%;flex-wrap:wrap;align-items:center}
.tools input[type="search"],.tools select{font:400 15px/1 "Patrick Hand";padding:8px 10px;
  border:2px solid var(--chalk-3);border-radius:9px;background:rgba(0,0,0,.18);color:var(--chalk)}
.tools input[type="search"]{flex:1 1 170px;min-width:130px}
.tools select option{background:#2A322E;color:#F0EDE4}
.tiza{appearance:none;background:none;border:2px solid var(--chalk-3);color:var(--chalk-2);
  font:400 15px/1 "Patrick Hand";padding:9px 13px;border-radius:12px 9px 13px 10px;cursor:pointer}
.tiza[aria-pressed="true"]{background:var(--chalk);color:var(--board);border-color:var(--chalk)}

main{max-width:900px;margin:0 auto;padding:6px 16px 90px}

/* ---- momentos ---- */
.panel{margin-top:18px;border:2px solid var(--chalk-3);border-radius:16px 12px 18px 11px;padding:13px 14px 15px;background:rgba(0,0,0,.14)}
.panel>h2{font-size:26px;margin:0 0 2px;font-weight:700}
.panel>p{margin:0 0 11px;font-size:15px;color:var(--chalk-2)}
.momentos{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:9px}
.mom{border:2px solid var(--chalk-3);border-radius:11px 9px 12px 8px;padding:10px 11px;display:flex;flex-direction:column;gap:3px}
.mom .t{font:700 22px/1 "Caveat";color:var(--chalk)}
.mom .q{font-size:14.5px;color:var(--chalk-2);flex:1}
.mom.activo{border-color:var(--amarillo);box-shadow:0 0 0 1px var(--amarillo), 0 0 18px rgba(243,209,122,.22)}
.mom.activo .t{color:var(--amarillo)}
.mom.pasado{opacity:.5}
.mom.listo{border-color:var(--verde)}
.mom .prog{font-size:14px;color:var(--chalk-2)}
.campana{appearance:none;background:none;border:2px solid var(--chalk-3);cursor:pointer;
  font-size:19px;line-height:1;padding:7px 11px;border-radius:11px 8px 12px 9px;
  margin-top:6px;align-self:flex-start;filter:grayscale(1) opacity(.55)}
.campana[aria-pressed="true"]{border-color:var(--amarillo);filter:none}
.mom.listo .prog{color:var(--verde)}
.mom .marca{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:14px;color:var(--chalk-2);cursor:pointer}
input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:21px;height:21px;margin:0;flex:none;
  border:2px solid var(--chalk-3);border-radius:4px 3px 5px 3px;background:none;cursor:pointer;position:relative}
input[type="checkbox"]:checked{border-color:var(--verde)}
input[type="checkbox"]:checked::after{content:"✓";position:absolute;inset:-6px 0 0 1px;
  font:700 21px/1 "Caveat";color:var(--verde)}
.reportar{display:inline-flex;align-items:center;gap:8px;margin-top:12px;
  font:700 23px/1 "Caveat";color:var(--board);background:var(--chalk);
  border:2px solid var(--chalk);border-radius:14px 10px 16px 11px;padding:10px 20px;text-decoration:none}
.reportar:hover{background:var(--amarillo);border-color:var(--amarillo)}
.acciones{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.link{font:400 15px/1 "Patrick Hand";color:var(--chalk-3);text-decoration:underline;
  text-underline-offset:4px;text-decoration-style:dotted}
.link:hover{color:var(--chalk-2)}

/* ---- lista ---- */
.bloque{margin-top:22px}
.encab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.encab b{font:700 25px/1 "Caveat"}
.encab i{flex:1;height:0;border-top:2px dashed var(--rule)}
.encab em{font-style:normal;font:600 17px/1 "Caveat";color:var(--amarillo)}
.clase{display:grid;grid-template-columns:112px 1fr auto auto;gap:12px;align-items:center;
  border:2px solid var(--chalk-3);border-radius:11px 9px 12px 8px;padding:10px 13px;margin-bottom:6px}
.checks{display:flex;gap:6px}
.checks label{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  font:400 12px/1 "Patrick Hand";color:var(--chalk-3)}
.checks input:checked + i{color:var(--verde)}
.checks i{font-style:normal}
.obs{appearance:none;background:none;border:2px solid var(--chalk-3);color:var(--chalk-3);
  font:400 13px/1 "Patrick Hand";padding:7px 9px;border-radius:9px 7px 10px 7px;cursor:pointer;white-space:nowrap}
.obs[aria-pressed="true"]{border-color:var(--rojo);color:var(--rojo)}
.clase.falta{border-color:var(--rojo)}
.clase.ahora{border-color:var(--verde);background:rgba(159,214,168,.08)}
.clase.pasada{opacity:.46}
.clase.hecha .curso{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--chalk-3)}
.aula{font:700 20px/1.1 "Caveat"}
.aula span{display:block;font:400 13.5px/1.3 "Patrick Hand";color:var(--chalk-2)}
.curso{font-size:16.5px}
.doc{font-size:14.5px;color:var(--chalk-2)}
.sec{font:700 19px/1 "Caveat";color:var(--chalk-2);border:2px solid var(--chalk-3);border-radius:7px 5px 8px 6px;padding:5px 7px;white-space:nowrap}
.nombre{font:400 14.5px/1.2 "Patrick Hand";color:var(--chalk);background:rgba(0,0,0,.22);
  border:2px solid var(--chalk-3);border-radius:7px;padding:4px 7px;width:100%;max-width:330px;margin-top:2px}
.vacia{margin-top:22px;padding:22px;text-align:center;color:var(--chalk-2);border:2px dashed var(--rule);border-radius:12px}
.nota{margin-top:14px;font-size:14.5px;color:var(--chalk-2);border:2px dashed var(--rule);border-radius:10px;padding:9px 12px}
#wsp{display:none;margin-top:14px;border:2px dashed var(--amarillo);border-radius:12px;padding:12px 13px}
#wsp.on{display:block}
#wsp textarea{width:100%;min-height:92px;resize:vertical;margin-top:9px;
  font:400 15px/1.45 "Patrick Hand";color:var(--chalk);background:rgba(0,0,0,.25);
  border:2px solid var(--chalk-3);border-radius:9px;padding:10px}
footer{margin-top:28px;padding-top:12px;border-top:2px dashed var(--rule);font-size:14px;color:var(--chalk-3)}

/* ---- aviso de alarma ---- */
#alarma{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  z-index:50;display:none;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--board-2);border:3px solid var(--amarillo);border-radius:16px 12px 18px 11px;
  padding:13px 15px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:876px;margin:0 auto}
#alarma.on{display:flex}
#alarma .txt{flex:1;min-width:180px}
#alarma .txt b{display:block;font:700 25px/1.1 "Caveat";color:var(--amarillo)}
@media (max-width:760px){
  main{padding-left:12px;padding-right:12px}
  .hd{padding:9px 12px;gap:7px}
  h1{font-size:24px}
  .reloj{font-size:22px}
  .dias{gap:4px}
  .dia{padding:8px 12px;font-size:16px}
  .tools{gap:6px}
  .tools input[type="search"]{flex:1 1 100%}
  .tools select,.tiza{flex:1 1 46%;text-align:center;padding:11px 8px}
  .momentos{grid-template-columns:1fr 1fr}
  .clase{grid-template-columns:1fr auto;gap:8px;row-gap:7px;padding:11px 12px}
  .aula{grid-row:1;grid-column:1}
  .aula span{display:inline;margin-left:8px}
  .sec{grid-row:1;grid-column:2;align-self:start}
  .info{grid-column:1/3}
  .checks{grid-column:1/3;justify-content:space-between;align-items:center;
    border-top:2px dashed var(--rule);padding-top:8px}
  .checks label{flex-direction:row;gap:6px;font-size:14px}
  .checks input[type="checkbox"]{width:26px;height:26px}
  .checks input[type="checkbox"]:checked::after{inset:-7px 0 0 2px;font-size:26px}
  .reportar{width:100%;justify-content:center}
}
@media (max-width:400px){ .momentos{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#000}header{position:static}.tools,.dias,#alarma{display:none}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>Monitoreo de visitas a sede</h1>
    <span class="reloj" id="reloj"></span>
    <div class="dias" id="dias"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Buscar aula, docente, curso o sección" aria-label="Buscar">
      <select id="orden" aria-label="Ordenar por">
        <option value="hora">Por horario</option>
        <option value="aula">Por aula (A-Z)</option>
        <option value="ciclo">Por ciclo</option>
        <option value="piso">Por piso</option>
      </select>
      <select id="turno" aria-label="Turno">
        <option value="">Todo el día</option>
        <option value="M">Mañana</option>
        <option value="T">Tarde</option>
        <option value="N">Noche</option>
      </select>
      <button class="tiza" id="sonido" aria-pressed="false">Activar alarma</button>
      <button class="tiza" id="editar" aria-pressed="false">Editar nombres</button>
      <button class="tiza" id="limpiar">Borrar marcas</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Momentos del día</h2>
    <p id="subPanel"></p>
    <div class="momentos" id="momentos"></div>
    <div class="acciones">
      <button class="reportar" id="wspBtn2">Generar mensaje</button>
      <a class="link" href="https://forms.gle/GK9A1BXMHHd7Ajz27" target="_blank" rel="noopener">Abrir el formulario</a>
    </div>
  </section>

  <section id="wsp">
    <strong class="mano" style="font-size:23px">Mensaje para José</strong>
    <select id="wspMom" aria-label="Momento a reportar" style="margin-top:8px;width:100%;
      font:400 15px/1 'Patrick Hand';padding:9px 10px;border:2px solid var(--chalk-3);
      border-radius:9px;background:rgba(0,0,0,.18);color:var(--chalk)"></select>
    <textarea id="wspTxt" readonly aria-label="Mensaje de WhatsApp"></textarea>
    <div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">
      <button class="tiza" id="wspCopiar">Copiar</button>
      <button class="tiza" id="wspCerrar">Cerrar</button>
      <span id="wspOk" style="align-self:center;color:var(--verde)"></span>
    </div>
  </section>

  <div id="aviso"></div>
  <div id="cont"></div>
  <footer id="pie"></footer>
</main>

<div id="alarma" role="alert">
  <div class="txt"><b id="alTitulo"></b><span id="alDet"></span></div>
  <button class="reportar" style="margin-top:0" id="alMensaje">Mensaje</button>
  <a class="link" href="https://forms.gle/GK9A1BXMHHd7Ajz27" target="_blank" rel="noopener">Formulario</a>
  <button class="tiza" id="alCerrar">Cerrar</button>
</div>

const titulo = s => s.toLocaleLowerCase("es").replace(/(^|[\s(/-])([\p{L}][\p{L}'’.]*)/gu,

const min = s => { const p = String(s).replace(",",".").split("."); return (+p[0])*60 + (+(p[1]||0)); };
const hhmm = v => String(Math.floor(v/60)).padStart(2,"0") + ":" + String(v%60).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- alarma ---------- */
let audio = null, sonando = false, disparadas = new Set();
$("sonido").onclick = () => {
  if(sonando){ sonando = false; $("sonido").setAttribute("aria-pressed","false"); $("sonido").textContent = "Activar alarma"; return; }
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === "suspended") audio.resume();
    sonando = true;
    $("sonido").setAttribute("aria-pressed","true");
    $("sonido").textContent = "Alarma activa";
    pitar(1);
  } catch(e){
    sonando = true; $("sonido").setAttribute("aria-pressed","true"); $("sonido").textContent = "Alarma activa";
  }
};
function pitar(veces){
  if(!audio) return;
  for(let i = 0; i < veces; i++){
    const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i*0.42;
    o.type = "triangle"; o.frequency.setValueAtTime(880, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
    o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.36);
  }
}
$("alCerrar").onclick = () => $("alarma").classList.remove("on");
function revisarAlarma(){
  if(!sonando || !esHoy()) return;
  const t = ahora();
  for(const m of MOMENTOS){
    if(alarmas.has(m.id) && t >= m.ini && t < m.ini + 2 && !disparadas.has(m.id)){
      disparadas.add(m.id);
      pitar(3);
      $("alTitulo").textContent = m.n + " · " + hhmm(m.ini) + "–" + hhmm(m.fin);
      $("alDet").textContent = m.q;
      $("alarma").classList.add("on");
    }
  }
}

const PLANTILLA = {
  m1: { ok:"Hola José, buen día. Desde la sede Arequipa: todos los docentes llegaron en su hora.",
        obs:"Hola José, buen día. Desde la sede Arequipa: los docentes llegaron en su hora," },

  m3: { ok:"Tercer recorrido desde la sede Arequipa. Break de 15 minutos conforme.",

  m4: { ok:"Cuarto recorrido desde la sede Arequipa. Las sesiones cerraron en su horario.",
        obs:"Cuarto recorrido desde la sede Arequipa. Las sesiones cerraron en su horario," }
};
let ultimoMom = null;
function momentoSugerido(){
  const L = ultima;
  if(L.length){
    // el bloque que se está marcando: el último tocado, si aún no se reportó
    if(ultimoMom) return ultimoMom;
    const completo = m => L.every(c => marcas.has(c.key+"|"+m.id));
    const enCurso = MOMENTOS.find(m => !completo(m) && L.some(c => marcas.has(c.key+"|"+m.id)));
    if(enCurso) return enCurso.id;
    const pendiente = MOMENTOS.find(m => !completo(m));
    if(pendiente) return pendiente.id;
  }
  if(!esHoy()) return "m1";
  const t = ahora();
  let id = "m1";
  for(const m of MOMENTOS) if(t >= m.ini) id = m.id;
  return id;
}
function mensaje(momId){
  const sin = ultima.filter(c => faltas.has(c.key));
  const pl = PLANTILLA[momId] || PLANTILLA.m1;
  if(!sin.length) return pl.ok;
  const lista = sin.map(c => `${c.aula.replace("AQP-","")} (${c.seccion})`).join(" y ");
  return sin.length === 1
    ? `${pl.obs} salvo en el aula ${lista}, donde no se presentó el docente ${docente(sin[0])}.`
    : `${pl.obs} salvo en las aulas ${lista}, donde no se presentó el docente.`;
}
function pintarMensaje(){ $("wspTxt").value = mensaje($("wspMom").value); $("wspOk").textContent = ""; }

  $("wspMom").value = id;

}

/* ---------- render ---------- */
function render(){
  [...$("dias").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.d === est.dia));
  $("editar").setAttribute("aria-pressed", est.editar);
  $("editar").textContent = est.editar ? "Listo" : "Editar nombres";
  const t = ahora(), vivo = esHoy() && !est.editar;
  $("reloj").textContent = esHoy() ? hhmm(t) : est.dia[0] + est.dia.slice(1).toLowerCase();

  const list = datos.filter(d => d.dia === est.dia
      && (!est.turno || d.turno === est.turno)
      && (!est.q || (d.aula+" "+docente(d)+" "+d.cursoN+" "+d.seccion).toLowerCase().includes(est.q)))
    .sort((a,b) => {
      if(est.orden === "aula")  return a.aula.localeCompare(b.aula) || a.ini-b.ini;
      if(est.orden === "ciclo") return a.ciclo.localeCompare(b.ciclo) || a.ini-b.ini || a.aula.localeCompare(b.aula);
      if(est.orden === "piso")  return (a.piso === "Laboratorios") - (b.piso === "Laboratorios")
                                    || a.piso.localeCompare(b.piso) || a.ini-b.ini || a.aula.localeCompare(b.aula);
      return a.ini-b.ini || a.fin-b.fin || a.aula.localeCompare(b.aula);
    });
  ultima = list;

  $("subPanel").textContent = esHoy()
    ? "Marca cada aula abajo y reporta el bloque cuando lo cierres. " + (sonando ? "La alarma avisa al empezar cada momento." : "Activa la alarma para que avise al empezar cada momento.")
    : "Checklist de la visita. Marcas y alarma funcionan en el día de hoy.";

  $("momentos").innerHTML = MOMENTOS.map(m => {
    const hechas = list.filter(c => marcas.has(c.key+"|"+m.id)).length;
    const listo = list.length > 0 && hechas === list.length;
    const activo = esHoy() && t >= m.ini && t < m.fin, pasado = esHoy() && t >= m.fin;
    return `<article class="mom ${activo?"activo":""} ${listo?"listo":""} ${pasado && !listo ? "pasado":""}">
      <span class="t">${hhmm(m.ini)}–${hhmm(m.fin)}</span>
      <span class="q"><strong>${m.n}</strong><br>${m.q}</span>
      <span class="prog">${hechas}/${list.length} aulas</span>
      <button class="campana" data-alarma="${m.id}" aria-pressed="${alarmas.has(m.id)}"
        title="${alarmas.has(m.id) ? "Alarma activa para este momento" : "Alarma desactivada para este momento"}"
        aria-label="${alarmas.has(m.id) ? "Desactivar" : "Activar"} alarma del ${m.n}">${alarmas.has(m.id) ? "🔔" : "🔕"}</button>
    </article>`;
  }).join("");

  $("aviso").innerHTML = est.editar
    ? `<div class="nota">Corrige el nombre del docente y presiona Enter. El cambio se aplica a todas sus clases y queda guardado en este dispositivo.</div>` : "";

  if(!list.length){ $("cont").innerHTML = `<div class="vacia">No hay clases con estos filtros.</div>`; pie(0,0); return; }

  const etiqueta = c => est.orden === "hora" ? hhmm(c.ini)
                      : est.orden === "aula" ? c.aula
                      : est.orden === "ciclo" ? c.ciclo : c.piso;
  const grupos = [];
  for(const c of list){
    const et = etiqueta(c);
    if(!grupos.length || grupos[grupos.length-1].et !== et) grupos.push({et, items:[]});
    grupos[grupos.length-1].items.push(c);
  }

  $("cont").innerHTML = grupos.map(g => {
    const enCurso = vivo && g.items.some(x => t >= x.ini && t < x.fin);
    return `<section class="bloque"><div class="encab"><b>${esc(g.et)}</b><i></i>${enCurso?"<em>en curso</em>":""}</div>`
      + g.items.map(c => {
        const viva = vivo && t >= c.ini && t < c.fin, pasada = vivo && t >= c.fin;
        const izq = est.orden === "aula" ? hhmm(c.ini) : c.aula;
        const sub = est.orden === "hora" ? "hasta " + hhmm(c.fin) : hhmm(c.ini) + "–" + hhmm(c.fin);
        const nom = est.editar
          ? `<input class="nombre" data-id="${c.id}" value="${esc(docente(c))}" aria-label="Nombre del docente">`
          : `<span class="doc">${esc(docente(c))}</span>`;
        const hechos = MOMENTOS.filter(m => marcas.has(c.key+"|"+m.id)).length;
        const falta = faltas.has(c.key);
        return `<div class="clase ${viva?"ahora":""} ${pasada?"pasada":""} ${hechos===MOMENTOS.length?"hecha":""} ${falta?"falta":""}" data-k="${c.key}">
          <span class="aula">${esc(izq)}<span>${sub}</span></span>
          <span class="info"><span class="curso">${esc(c.cursoN)}</span><br>${nom}</span>
          <span class="sec">${esc(c.seccion)}</span>
          <span class="checks">${MOMENTOS.map(m => `<label title="${m.n} (${hhmm(m.ini)}–${hhmm(m.fin)}): ${m.q}">
            <input type="checkbox" data-k="${c.key}" data-m="${m.id}" ${marcas.has(c.key+"|"+m.id)?"checked":""}
                   aria-label="${m.n} en ${esc(c.aula)}"><i>${m.num}</i></label>`).join("")}
            <button class="obs" data-k="${c.key}" aria-pressed="${falta}"
              title="Reportar que no hay docente en el aula">${falta ? "Falta docente" : "Sin docente"}</button></span>
        </div>`;
      }).join("") + `</section>`;
  }).join("");

  pie(list.length, list.filter(c => MOMENTOS.every(m => marcas.has(c.key+"|"+m.id))).length);
}
let ultima = [];
function pie(n,m){
  $("pie").textContent = `${n} clase${n===1?"":"s"} · ${m} con los 4 monitoreos completos. Las marcas se reinician cada día; los nombres corregidos se conservan. Todo se guarda solo en este dispositivo.`;
}
render();
</script>
